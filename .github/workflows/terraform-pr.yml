name: 'Terraform CI/CD Pipeline'

on:

  # ==========================================================
  # 1. PUSH TO FEATURE BRANCH
  #    -> Terraform PLAN only
  # ==========================================================
  push:
    branches:
      - feature/ApplyAfterManualApproval


  # ==========================================================
  # 2. PR EVENTS
  #
  #    When PR is opened/updated:
  #       -> PLAN
  #
  #    When PR is approved:
  #       -> PLAN again
  #       -> Architect approval
  #       -> APPLY
  # ==========================================================
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened


  # ==========================================================
  # 3. PR REVIEW EVENT
  #
  #    When someone APPROVES the PR:
  #       -> PLAN
  #       -> Manual Architect Approval
  #       -> APPLY
  # ==========================================================
  pull_request_review:
    types:
      - submitted


# ============================================================
# Permissions
# ============================================================
permissions:
  contents: read


# ============================================================
# JOB 1 - TERRAFORM PLAN
# ============================================================
jobs:

  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest

    # Run PLAN when:
    #
    # 1. Feature branch is pushed
    # 2. PR is opened/updated/reopened
    # 3. PR is approved
    #
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved'
      )

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------
      - name: Terraform Init
        run: terraform init
        env:
           ARM_CLIENT_ID: "6e95fee0-4770-4558-a164-74608509e837"
           ARM_CLIENT_SECRET: "k5~8Q~gyYjrwTju5WtBmWJNOl.cCghH-DtBDqagP"
           ARM_SUBSCRIPTION_ID: "d1e2e70f-5eec-4913-a1bd-9bbdd9369c70"
           ARM_TENANT_ID: "1c617179-6d77-43bd-9e77-fffbda9eb462"


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan
        env:
           ARM_CLIENT_ID: "6e95fee0-4770-4558-a164-74608509e837"
           ARM_CLIENT_SECRET: "k5~8Q~gyYjrwTju5WtBmWJNOl.cCghH-DtBDqagP"
           ARM_SUBSCRIPTION_ID: "d1e2e70f-5eec-4913-a1bd-9bbdd9369c70"
           ARM_TENANT_ID: "1c617179-6d77-43bd-9e77-fffbda9eb462"



  # ============================================================
  # JOB 2 - TERRAFORM APPLY
  #
  # This job ONLY runs when:
  #
  # 1. PR review was submitted
  # 2. Review state is APPROVED
  #
  # AND
  #
  # 3. Architect manually approves the "terraform-apply"
  #    GitHub Environment
  #
  # ============================================================
  terraform-apply:
    name: 'Terraform Apply'

    needs: terraform-plan

    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved'

    # ========================================================
    # IMPORTANT:
    #
    # Configure a GitHub Environment named:
    #
    # terraform-apply
    #
    # Add your Architect as a Required Reviewer.
    #
    # The job will PAUSE here until Architect approves it.
    # ========================================================
    environment:
      name: terraform-apply

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------
      - name: Terraform Init
        run: terraform init
        env:
           ARM_CLIENT_ID: "6e95fee0-4770-4558-a164-74608509e837"
           ARM_CLIENT_SECRET: "k5~8Q~gyYjrwTju5WtBmWJNOl.cCghH-DtBDqagP"
           ARM_SUBSCRIPTION_ID: "d1e2e70f-5eec-4913-a1bd-9bbdd9369c70"
           ARM_TENANT_ID: "1c617179-6d77-43bd-9e77-fffbda9eb462"


      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
           ARM_CLIENT_ID: "6e95fee0-4770-4558-a164-74608509e837"
           ARM_CLIENT_SECRET: "k5~8Q~gyYjrwTju5WtBmWJNOl.cCghH-DtBDqagP"
           ARM_SUBSCRIPTION_ID: "d1e2e70f-5eec-4913-a1bd-9bbdd9369c70"
           ARM_TENANT_ID: "1c617179-6d77-43bd-9e77-fffbda9eb462"

