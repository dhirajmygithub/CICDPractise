name: 'Terraform CI/CD Pipeline'

on:
  # ==========================================================
  # 1. PUSH TO FEATURE BRANCH OR MAIN BRANCH
  # ==========================================================
  push:
    branches:
      - feature/ApplyAfterManualApproval
      - main

  # ==========================================================
  # 2. PULL REQUEST EVENTS (Validate & Plan only)
  # ==========================================================
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# ============================================================
# Permissions
# ============================================================
permissions:
  contents: read

# ============================================================
# JOBS
# ============================================================
jobs:

  # ----------------------------------------------------------
  # JOB 1 - TERRAFORM PLAN
  # Runs on: Feature Branch push, PR creation/update, and Main push
  # ----------------------------------------------------------
  terraform-plan:
    name: 'Terraform Validate & Plan'
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # Terraform Init
      - name: Terraform Init
        run: terraform init
        env:
           ARM_CLIENT_ID: "6e95fee0-4770-4558-a164-74608509e837"
           ARM_CLIENT_SECRET: "k5~8Q~gyYjrwTju5WtBmWJNOl.cCghH-DtBDqagP"
           ARM_SUBSCRIPTION_ID: "d1e2e70f-5eec-4913-a1bd-9bbdd9369c70"
           ARM_TENANT_ID: "1c617179-6d77-43bd-9e77-fffbda9eb462"

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan
        env:
           ARM_CLIENT_ID: "6e95fee0-4770-4558-a164-74608509e837"
           ARM_CLIENT_SECRET: "k5~8Q~gyYjrwTju5WtBmWJNOl.cCghH-DtBDqagP"
           ARM_SUBSCRIPTION_ID: "d1e2e70f-5eec-4913-a1bd-9bbdd9369c70"
           ARM_TENANT_ID: "1c617179-6d77-43bd-9e77-fffbda9eb462"


  # ----------------------------------------------------------
  # JOB 2 - TERRAFORM APPLY
  # PAUSES for manual approval from Architect before running!
  # ----------------------------------------------------------
  terraform-apply:
    name: 'Terraform Apply'
    needs: terraform-plan
    runs-on: ubuntu-latest

    # 🛑 PAUSES pipeline for manual approval under Environment 'production'
    environment: production

    # Only run Apply on the main branch (after PR is merged)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # Terraform Init
      - name: Terraform Init
        run: terraform init
        env:
           ARM_CLIENT_ID: "6e95fee0-4770-4558-a164-74608509e837"
           ARM_CLIENT_SECRET: "k5~8Q~gyYjrwTju5WtBmWJNOl.cCghH-DtBDqagP"
           ARM_SUBSCRIPTION_ID: "d1e2e70f-5eec-4913-a1bd-9bbdd9369c70"
           ARM_TENANT_ID: "1c617179-6d77-43bd-9e77-fffbda9eb462"

      # Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
           ARM_CLIENT_ID: "6e95fee0-4770-4558-a164-74608509e837"
           ARM_CLIENT_SECRET: "k5~8Q~gyYjrwTju5WtBmWJNOl.cCghH-DtBDqagP"
           ARM_SUBSCRIPTION_ID: "d1e2e70f-5eec-4913-a1bd-9bbdd9369c70"
           ARM_TENANT_ID: "1c617179-6d77-43bd-9e77-fffbda9eb462"